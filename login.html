<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Administración | Panel Multitenant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f9f9f9; color: #000; }
        .card { background: white; border-radius: 24px; padding: 20px; box-shadow: 0 4px 25px rgba(0,0,0,0.06); }
    </style>
</head>
<body class="p-6 pb-32">

    <div class="w-full max-w-2xl mx-auto space-y-6">
        <!-- Header de Administración -->
        <div class="flex justify-between items-center bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-black rounded-xl flex items-center justify-center text-white font-black italic">AD</div>
                <div>
                    <h1 id="adminBusinessName" class="text-sm font-black uppercase italic">Panel de Administración</h1>
                    <p id="adminUserEmail" class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">Cargando sesión...</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <a href="index.html" class="px-3 py-2 bg-gray-100 hover:bg-gray-200 text-black text-[10px] font-black uppercase rounded-xl transition">Panel</a>
                <a href="catalogo.html" class="px-3 py-2 bg-gray-100 hover:bg-gray-200 text-black text-[10px] font-black uppercase rounded-xl transition">Catálogo</a>
                <button onclick="handleLogout()" class="px-3 py-2 bg-red-50 hover:bg-red-100 text-red-600 text-[10px] font-black uppercase rounded-xl transition">Salir</button>
            </div>
        </div>

        <!-- Notificación Toast -->
        <div id="toast" class="hidden p-4 rounded-2xl text-xs font-bold text-center transition-all"></div>

        <!-- Sección de Configuración del Negocio -->
        <div class="card space-y-4">
            <h2 class="text-xs font-black uppercase tracking-widest text-gray-400">Configuración de la Tienda</h2>
            <form id="businessForm" onsubmit="saveBusinessConfig(event)" class="space-y-3">
                <div>
                    <label class="text-[10px] font-bold uppercase text-gray-500">Nombre del Negocio</label>
                    <input type="text" id="cfgBusinessName" required class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-xs font-bold outline-none focus:border-black transition">
                </div>
                <button type="submit" class="w-full bg-black text-white py-3 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-gray-800 transition">
                    Guardar Cambios del Negocio
                </button>
            </form>
        </div>

        <!-- Sección de Gestión de Productos -->
        <div class="card space-y-4">
            <h2 class="text-xs font-black uppercase tracking-widest text-gray-400">Agregar Producto al Catálogo</h2>
            <form id="productForm" onsubmit="addProduct(event)" class="space-y-3">
                <div>
                    <label class="text-[10px] font-bold uppercase text-gray-500">Nombre del Producto</label>
                    <input type="text" id="prodName" required placeholder="Ej: Perfume Exclusive" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-xs font-bold outline-none focus:border-black transition">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-bold uppercase text-gray-500">Precio ($)</label>
                        <input type="number" step="0.01" id="prodPrice" required placeholder="0.00" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-xs font-bold outline-none focus:border-black transition">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold uppercase text-gray-500">WhatsApp de Pedidos</label>
                        <input type="text" id="prodWa" required placeholder="584120000000" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-xs font-bold outline-none focus:border-black transition">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-bold uppercase text-gray-500">URL de la Imagen</label>
                    <input type="url" id="prodImg" required placeholder="https://..." class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-xs font-bold outline-none focus:border-black transition">
                </div>
                <button type="submit" class="w-full bg-black text-white py-3 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-gray-800 transition">
                    Publicar Producto
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCrjjeOoXPOtJDXDfrHLOA4Ny0QW2zfVWk",
            authDomain: "apps-d45d6.firebaseapp.com",
            projectId: "apps-d45d6",
            storageBucket: "apps-d45d6.firebasestorage.app",
            messagingSenderId: "502648373937",
            appId: "1:502648373937:web:8c3beaa2a6c9289a4d9890"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        function showToast(message, isError = true) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.className = `p-4 rounded-2xl text-xs font-bold text-center transition-all ${isError ? 'bg-red-50 text-red-600 border border-red-100' : 'bg-green-50 text-green-600 border border-green-100'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 4000);
        }

        // Control de Sesión y Seguridad Multitenant
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }
            currentUser = user;
            document.getElementById('adminUserEmail').innerText = user.email;

            // Cargar datos de la tienda del usuario
            try {
                const userDoc = await doc(db, "users", user.uid);
                const docSnap = await getDoc(userDoc);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('adminBusinessName').innerText = data.businessName || "Mi Negocio";
                    document.getElementById('cfgBusinessName').value = data.businessName || "";
                }
            } catch (e) {
                console.error("Error al cargar datos:", e);
            }
        });

        window.saveBusinessConfig = async (e) => {
            e.preventDefault();
            if (!currentUser) return;
            const newName = document.getElementById('cfgBusinessName').value;

            try {
                // Actualizar perfil de usuario
                await setDoc(doc(db, "users", currentUser.uid), {
                    businessName: newName
                }, { merge: true });

                // Actualizar configuración global de negocio vinculada al ownerId
                await setDoc(doc(db, "config", "negocio"), {
                    name: newName,
                    ownerId: currentUser.uid
                }, { merge: true });

                document.getElementById('adminBusinessName').innerText = newName;
                showToast("¡Nombre del negocio actualizado con éxito!", false);
            } catch (error) {
                showToast("Error al guardar: " + error.message);
            }
        };

        window.addProduct = async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const name = document.getElementById('prodName').value;
            const price = document.getElementById('prodPrice').value;
            const whatsapp = document.getElementById('prodWa').value;
            const img = document.getElementById('prodImg').value;

            try {
                await addDoc(collection(db, "perfumes"), {
                    name: name,
                    priceNew: price,
                    whatsapp: whatsapp,
                    img: img,
                    ownerId: currentUser.uid, // Vinculado al dueño actual
                    createdAt: new Date().toISOString()
                });

                showToast("¡Producto publicado correctamente!", false);
                document.getElementById('productForm').reset();
            } catch (error) {
                showToast("Error al publicar producto: " + error.message);
            }
        };

        window.handleLogout = async () => {
            await signOut(auth);
            localStorage.removeItem('currentOwnerUid');
            window.location.href = "login.html";
        };

        lucide.createIcons();
    </script>
</body>
</html>
