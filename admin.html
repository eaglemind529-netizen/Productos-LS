<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaddy INC - Gestión de Variantes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #e5e5e5;
            background-image: radial-gradient(rgba(245, 158, 11, 0.03) 1px, transparent 0);
            background-size: 40px 40px;
        }
        .glass-panel {
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .variant-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .variant-card:hover { border-color: rgba(245, 158, 11, 0.3); background: rgba(255, 255, 255, 0.05); }
        input, select, textarea {
            background: rgba(255, 255, 255, 0.02) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 12px !important;
            padding: 10px 14px !important;
            color: white !important;
            outline: none !important;
            font-size: 0.875rem !important;
        }
        input:focus { border-color: #f59e0b !important; }
        .btn-amber { background: linear-gradient(to right, #f59e0b, #d97706); color: black; font-weight: 900; }
        .badge-gender { font-size: 8px; font-weight: 900; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <div class="max-w-6xl mx-auto px-4 pt-10">
        <!-- Header -->
        <header class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-amber-500 rounded-xl flex items-center justify-center shadow-lg shadow-amber-500/20">
                    <i data-lucide="layers" class="text-black"></i>
                </div>
                <div>
                    <h1 id="headerCompanyName" class="text-xl font-black italic uppercase tracking-tighter text-white leading-none">Jaddy INC</h1>
                    <p id="headerUserEmail" class="text-[9px] font-bold text-amber-500 uppercase tracking-[0.2em]">Cargando sesión...</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <!-- Botón acceso a Catálogo / Clientes -->
                <a href="catalogo.html" class="bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/20 px-4 py-2 rounded-xl flex items-center gap-2 transition">
                    <i data-lucide="external-link" class="w-4 h-4 text-amber-500"></i>
                    <span class="text-[9px] font-black uppercase tracking-widest text-amber-500 italic">Ver Catálogo</span>
                </a>
                <button onclick="handleLogout()" class="bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 px-4 py-2 rounded-xl flex items-center gap-2 transition text-red-400">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                    <span class="text-[9px] font-black uppercase tracking-widest italic">Salir</span>
                </button>
                <div class="bg-white/5 px-4 py-2 rounded-xl border border-white/5 text-right">
                    <span id="totalProducts" class="text-xl font-black text-white">0</span>
                    <p class="text-[8px] text-neutral-500 uppercase font-bold italic">Categorías Base</p>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Formulario Base y Configuración de Empresa -->
            <div class="lg:col-span-4 space-y-6">
                <!-- Panel de Configuración de Empresa -->
                <div class="glass-panel p-6 rounded-[2rem]">
                    <h2 class="text-xs font-black uppercase text-amber-500 mb-4 flex items-center gap-2 italic">
                        <i data-lucide="building" class="w-4 h-4"></i> Nombre de la Empresa
                    </h2>
                    <div class="space-y-3">
                        <input type="text" id="companyNameInput" placeholder="Nombre de tu empresa" class="w-full">
                        <button type="button" onclick="saveCompanyName()" class="w-full bg-amber-500/10 hover:bg-amber-500/20 text-amber-500 border border-amber-500/20 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition">
                            Actualizar Nombre
                        </button>
                    </div>
                </div>

                <div class="glass-panel p-6 rounded-[2rem]">
                    <h2 class="text-xs font-black uppercase text-amber-500 mb-6 flex items-center gap-2 italic">
                        <i data-lucide="package" class="w-4 h-4"></i> Producto Principal
                    </h2>
                    
                    <form id="mainForm" class="space-y-4">
                        <input type="hidden" id="mainId">
                        
                        <div class="space-y-1">
                            <label class="text-[10px] uppercase font-bold text-neutral-500 ml-1">Nombre General</label>
                            <input type="text" id="mainName" placeholder="Ej: Perfumes Árabes" required class="w-full">
                        </div>

                        <div class="space-y-1">
                            <label class="text-[10px] uppercase font-bold text-neutral-500 ml-1">WhatsApp de Pedidos (Sin +)</label>
                            <input type="text" id="mainWhatsApp" placeholder="Ej: 573001234567" required class="w-full border-green-500/20">
                        </div>

                        <div class="space-y-1">
                            <label class="text-[10px] uppercase font-bold text-neutral-500 ml-1">Categoría Principal</label>
                            <select id="mainCategory" class="w-full" required>
                                <option value="dama">Dama</option>
                                <option value="caballero">Caballero</option>
                                <option value="unisex">Unisex</option>
                            </select>
                        </div>

                        <div class="space-y-1">
                            <label class="text-[10px] uppercase font-bold text-neutral-500 ml-1">Imagen Principal</label>
                            <input type="text" id="mainImg" placeholder="Link de foto de portada" required class="w-full">
                        </div>

                        <div class="space-y-1">
                            <label class="text-[10px] uppercase font-bold text-neutral-500 ml-1">Descripción corta</label>
                            <textarea id="mainDesc" rows="2" class="w-full resize-none" placeholder="Opcional..."></textarea>
                        </div>

                        <button type="submit" id="mainSubmit" class="w-full btn-amber py-4 rounded-xl text-xs uppercase italic mt-2">
                            Registrar Producto Base
                        </button>
                        <button type="button" onclick="resetAll()" id="cancelBtn" class="w-full text-white/40 text-[9px] uppercase font-bold hidden">Cancelar y Limpiar</button>
                    </form>
                </div>
            </div>

            <!-- Inventario y Gestión -->
            <div class="lg:col-span-8 space-y-6">
                <!-- PANEL DE VARIANTES -->
                <div id="variantSection" class="hidden glass-panel p-6 rounded-[2rem] border-amber-500/40 bg-amber-500/[0.03]">
                    <div class="flex items-center justify-between mb-6">
                        <div>
                            <h2 class="text-xs font-black uppercase text-amber-500 italic">Agregar Variantes a:</h2>
                            <p id="currentProductName" class="text-xl font-black text-white uppercase italic"></p>
                        </div>
                        <button onclick="closeVariants()" class="bg-white/5 p-2 rounded-full hover:bg-white/10"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>

                    <form id="variantForm" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="space-y-3">
                                <input type="text" id="varTitle" placeholder="Nombre Variante (ej: Chocolate)" required class="w-full border-amber-500/20">
                                <select id="varGender" class="w-full" required>
                                    <option value="Dama">Dama</option>
                                    <option value="Caballero">Caballero</option>
                                    <option value="Unisex">Unisex</option>
                                </select>
                                <input type="text" id="varSize" placeholder="Presentación (ej: 100ml)" required class="w-full">
                            </div>
                            <div class="space-y-3">
                                <input type="text" id="varImg" placeholder="Link de Imagen específica" class="w-full">
                                <div class="grid grid-cols-2 gap-2">
                                    <input type="number" id="varPriceOld" step="0.01" placeholder="Antes $" class="w-full border-red-500/20 text-red-400">
                                    <input type="number" id="varPriceNew" step="0.01" placeholder="Hoy $" required class="w-full border-green-500/20 text-green-400">
                                </div>
                                <button type="submit" class="w-full btn-amber py-3 rounded-xl text-[10px] uppercase">
                                    <i data-lucide="plus-circle" class="inline w-3 h-3 mr-1"></i> Guardar Variante
                                </button>
                            </div>
                        </div>
                    </form>

                    <div id="variantList" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-8 border-t border-white/5 pt-6"></div>
                </div>

                <!-- Lista de Productos Existentes -->
                <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc, doc, updateDoc, setDoc, getDoc, arrayUnion, arrayRemove, where } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCrjjeOoXPOtJDXDfrHLOA4Ny0QW2zfVWk",
            authDomain: "apps-d45d6.firebaseapp.com",
            projectId: "apps-d45d6",
            storageBucket: "apps-d45d6.firebasestorage.app",
            messagingSenderId: "502648373937",
            appId: "1:502648373937:web:8c3beaa2a6c9289a4d9890"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        // Validación de Sesión y Seguridad Multitenant
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }
            currentUser = user;
            document.getElementById('headerUserEmail').innerText = user.email;

            // Cargar datos de la tienda vinculada a este usuario
            try {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().businessName) {
                    const bName = userDoc.data().businessName;
                    document.getElementById('headerCompanyName').innerText = bName;
                    const input = document.getElementById('companyNameInput');
                    if (input && document.activeElement !== input) {
                        input.value = bName;
                    }
                }
            } catch (e) {
                console.error("Error al cargar perfil:", e);
            }

            // Escuchar productos filtrados exclusivamente por el ownerId de este usuario
            setupRealtimeListener(user.uid);
        });

        window.saveCompanyName = async () => {
            if (!currentUser) return;
            const name = document.getElementById('companyNameInput').value.trim();
            if (!name) return;
            try {
                // Actualizar en el perfil del usuario
                await setDoc(doc(db, "users", currentUser.uid), { businessName: name }, { merge: true });
                // Actualizar configuración global de negocio del tenant
                await setDoc(doc(db, "config", "negocio"), { name: name, ownerId: currentUser.uid }, { merge: true });
                document.getElementById('headerCompanyName').innerText = name;
            } catch (e) {
                console.error("Error guardando nombre de empresa:", e);
            }
        };

        const formatImg = (url) => {
            if (!url) return "https://via.placeholder.com/400?text=Jaddy+INC";
            return url.trim().replace('dl=0', 'raw=1').replace('www.dropbox.com', 'dl.dropboxusercontent.com');
        };

        const mainForm = document.getElementById('mainForm');
        mainForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const id = document.getElementById('mainId').value;
            const data = {
                name: document.getElementById('mainName').value,
                whatsapp: document.getElementById('mainWhatsApp').value.replace(/\D/g,''),
                img: document.getElementById('mainImg').value,
                category: document.getElementById('mainCategory').value,
                description: document.getElementById('mainDesc').value,
                ownerId: currentUser.uid, // Clave para aislar datos por usuario
                updatedAt: serverTimestamp()
            };

            if (id) {
                await updateDoc(doc(db, "perfumes", id), data);
            } else {
                data.variants = [];
                data.createdAt = serverTimestamp();
                await addDoc(collection(db, "perfumes"), data);
            }
            resetAll();
        });

        const variantForm = document.getElementById('variantForm');
        variantForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const mainId = document.getElementById('mainId').value;
            if(!mainId) return;

            const newVariant = {
                id: Date.now().toString(),
                title: document.getElementById('varTitle').value,
                gender: document.getElementById('varGender').value,
                size: document.getElementById('varSize').value,
                priceOld: parseFloat(document.getElementById('varPriceOld
