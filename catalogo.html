<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRODUCTOS LS | Catálogo Multiproducto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #ffffff;
            color: #000;
            overflow-x: hidden;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1px;
            background-color: #f3f4f6;
        }

        .product-card {
            background: white;
            padding: 15px;
            text-align: center;
            position: relative;
            cursor: pointer;
        }

        .badge-count {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #000;
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }

        .product-card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: contain;
            margin-bottom: 8px;
        }

        /* Modal */
        #productModal {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 1000;
            display: none;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #productModal.active {
            display: flex;
            transform: translateY(0);
        }

        .modal-filter-bar {
            display: flex;
            padding: 10px;
            gap: 6px;
            border-bottom: 1px solid #f0f0f0;
            background: #fff;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .modal-filter-bar::-webkit-scrollbar { display: none; }

        .filter-btn {
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            color: #999;
            background: #f9f9f9;
            white-space: nowrap;
            border: 1px solid transparent;
        }

        .filter-btn.active {
            background: #000;
            color: #fff;
            border-color: #000;
        }

        .modal-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        /* Variante Card */
        .variant-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #fff;
            border-radius: 18px;
            border: 2px solid #f0f0f0;
            margin-bottom: 10px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .variant-card.selected {
            border-color: #000;
            background: #fafafa;
        }

        .selector-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .variant-card.selected .selector-dot {
            border-color: #000;
            background: #000;
        }

        .variant-card.selected .selector-dot::after {
            content: '';
            width: 7px;
            height: 7px;
            background: white;
            border-radius: 50%;
        }

        /* Barra de Carrito */
        #cartBar {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #000;
            color: white;
            padding: 16px 22px;
            border-radius: 20px;
            display: none;
            justify-content: space-between;
            align-items: center;
            z-index: 1100;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1010;
            background: #f0f0f0;
            border-radius: 50%;
            padding: 8px;
        }
    </style>
</head>
<body class="pb-32">

    <!-- Pantalla de control / ambiente de prueba si no hay sesión -->
    <div id="authCheckScreen" class="fixed inset-0 bg-[#f9f9f9] z-50 flex items-center justify-center p-6 transition-opacity duration-300">
        <div class="max-w-md w-full bg-white rounded-3xl p-6 shadow-xl text-center space-y-6 border border-gray-100">
            <div class="w-16 h-16 bg-black rounded-2xl flex items-center justify-center text-white font-black italic mx-auto text-xl shadow-xl">LS</div>
            <div class="space-y-2">
                <h2 class="text-xl font-black uppercase italic tracking-wider">Acceso Requerido</h2>
                <p class="text-xs text-gray-500 font-bold">Inicia sesión con tu cuenta o activa el modo de prueba para visualizar el catálogo.</p>
            </div>
            <div class="space-y-3">
                <a href="login.html" class="block w-full bg-black text-white py-4 rounded-xl text-[11px] font-black uppercase tracking-widest shadow-lg hover:bg-gray-800 transition">
                    Ir al Login
                </a>
                <button onclick="enableTestMode()" class="w-full bg-gray-100 hover:bg-gray-200 text-black py-3.5 rounded-xl text-[10px] font-black uppercase tracking-wider transition">
                    Activar Modo de Prueba
                </button>
            </div>
        </div>
    </div>

    <!-- Contenedor Principal del Catálogo -->
    <div id="mainCatalogView" class="opacity-0 transition-opacity duration-300">
        <!-- Header -->
        <header class="p-5 bg-white border-b border-gray-100 flex justify-between items-center sticky top-0 z-40">
            <div class="flex items-center gap-2.5">
                <a href="index.html" id="headerLogoBadge" class="w-8 h-8 bg-black rounded-lg flex items-center justify-center text-white font-bold text-xs italic">LS</a>
                <div>
                    <h1 id="headerBrandName" class="font-black text-[13px] uppercase tracking-tighter italic leading-none">PRODUCTOS LS</h1>
                    <p id="headerSubStatus" class="text-[9px] font-bold text-gray-400 uppercase tracking-wider mt-0.5">Catálogo</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a href="admin.html" class="text-[9px] font-black uppercase tracking-wider px-2.5 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 transition">Admin</a>
                <button onclick="logout()" class="text-[9px] font-black uppercase tracking-wider px-2.5 py-1.5 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 transition">Salir</button>
                <div class="relative">
                    <i data-lucide="shopping-bag" class="w-6 h-6"></i>
                    <div id="cartCountBadge" class="hidden absolute -top-2 -right-2 bg-red-500 text-white text-[8px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</div>
                </div>
            </div>
        </header>

        <!-- Aviso si no hay productos -->
        <div id="catalogEmptyMsg" class="hidden p-8 text-center text-xs font-bold text-gray-400">
            No hay productos registrados en el panel de administración para esta cuenta.
        </div>

        <!-- Grid de Catálogo -->
        <div id="catalogGrid" class="product-grid"></div>
    </div>

    <!-- Modal de Selección -->
    <div id="productModal">
        <button onclick="closeModal()" class="close-btn">
            <i data-lucide="x" class="w-5 h-5"></i>
        </button>

        <div class="pt-14 px-6 pb-4">
            <h2 id="modalTitle" class="text-2xl font-black italic uppercase leading-none mb-1">---</h2>
            <p id="modalDesc" class="text-xs text-gray-500 mt-1 hidden"></p>
            <p class="text-[9px] font-bold text-gray-400 uppercase tracking-[0.2em] mt-2">Elige tus favoritos</p>
        </div>

        <div class="modal-filter-bar">
            <button onclick="filterModalVariants('todos')" id="m-btn-todos" class="filter-btn active">Todos</button>
            <button onclick="filterModalVariants('dama')" id="m-btn-dama" class="filter-btn">Dama</button>
            <button onclick="filterModalVariants('caballero')" id="m-btn-caballero" class="filter-btn">Caballero</button>
            <button onclick="filterModalVariants('unisex')" id="m-btn-unisex" class="filter-btn">Unisex</button>
        </div>

        <div class="modal-scroll">
            <div id="variantsContainer"></div>
        </div>

        <div class="p-6 border-t border-gray-100 bg-white">
            <button onclick="closeModal()" class="w-full bg-black text-white py-4 rounded-xl font-black uppercase text-[11px] tracking-widest">
                Confirmar Selección
            </button>
        </div>
    </div>

    <!-- Barra de Resumen y WhatsApp -->
    <div id="cartBar" onclick="sendOrder()">
        <div class="flex flex-col">
            <span id="cartBarCount" class="text-[9px] font-bold uppercase tracking-widest opacity-70">0 productos</span>
            <span id="cartBarTotal" class="text-base font-black italic">$0</span>
        </div>
        <div class="flex items-center gap-3">
            <span class="text-[10px] font-black uppercase italic tracking-wider">Hacer pedido</span>
            <i data-lucide="send" class="w-4 h-4"></i>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCrjjeOoXPOtJDXDfrHLOA4Ny0QW2zfVWk",
            authDomain: "apps-d45d6.firebaseapp.com",
            projectId: "apps-d45d6",
            storageBucket: "apps-d45d6.firebasestorage.app",
            messagingSenderId: "502648373937",
            appId: "1:502648373937:web:8c3beaa2a6c9289a4d9890"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Datos de respaldo solo para cuando se active "Modo de Prueba" sin sesión ni documentos aún
        const sampleAdminProducts = [
            {
                id: "demo-1",
                name: "Perfumes Árabes",
                whatsapp: "584120000000",
                category: "unisex",
                description: "Selección de fragancias intensas y duraderas.",
                img: "https://via.placeholder.com/400?text=Perfumes+Arabes",
                variants: [
                    { id: "v1", title: "Chocolate", gender: "Unisex", size: "100ml", priceOld: 45, priceNew: 32, img: "" },
                    { id: "v2", title: "Oud Noir", gender: "Caballero", size: "100ml", priceOld: 50, priceNew: 38, img: "" },
                    { id: "v3", title: "Amber Rose", gender: "Dama", size: "100ml", priceOld: 42, priceNew: 30, img: "" }
                ]
            }
        ];

        let products = [];
        let cart = [];
        let currentProduct = null;
        let currentModalFilter = 'todos';
        let unsubscribeProducts = null;

        const cleanUrl = (url) => {
            if (!url) return "https://via.placeholder.com/400?text=PRODUCTOS+LS";
            return url.trim().replace('dl=0', 'raw=1').replace('www.dropbox.com', 'dl.dropboxusercontent.com');
        };

        function updateBranding(businessName) {
            const name = (businessName || "PRODUCTOS LS").trim();
            document.getElementById('headerBrandName').innerText = name;
            const words = name.split(/\s+/);
            let initials = "LS";
            if (words.length >= 2) {
                initials = (words[0][0] + words[1][0]).toUpperCase();
            } else if (words.length === 1 && words[0].length >= 2) {
                initials = words[0].substring(0, 2).toUpperCase();
            }
            document.getElementById('headerLogoBadge').innerText = initials;
        }

        function showAuthScreen() {
            const screen = document.getElementById('authCheckScreen');
            const main = document.getElementById('mainCatalogView');
            screen.style.display = 'flex';
            setTimeout(() => { screen.style.opacity = '1'; }, 10);
            main.style.opacity = '0';
        }

        function showCatalogScreen() {
            const screen = document.getElementById('authCheckScreen');
            const main = document.getElementById('mainCatalogView');
            screen.style.opacity = '0';
            setTimeout(() => {
                screen.style.display = 'none';
                main.style.opacity = '1';
            }, 300);
        }

        function getProductPriceText(p) {
            const variants = Array.isArray(p.variants) ? p.variants : [];
            if (variants.length > 0) {
                const prices = variants
                    .map(v => parseFloat(v.priceNew))
                    .filter(n => !Number.isNaN(n));
                if (prices.length > 0) {
                    return `$${Math.min(...prices).toFixed(2)}`;
                }
            }
            if (p.priceNew !== undefined && p.priceNew !== null && p.priceNew !== '') {
                const num = parseFloat(p.priceNew);
                return Number.isNaN(num) ? `$${p.priceNew}` : `$${num.toFixed(2)}`;
            }
            return '---';
        }

        function listenAdminProducts(ownerId, fallbackToSample = false) {
            if (unsubscribeProducts) {
                unsubscribeProducts();
                unsubscribeProducts = null;
            }

            const q = ownerId
                ? query(collection(db, "perfumes"), where("ownerId", "==", ownerId))
                : collection(db, "perfumes");

            unsubscribeProducts = onSnapshot(q, (snap) => {
                const docs = snap.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .sort((a, b) => (a.name || "").localeCompare(b.name || ""));

                if (docs.length > 0) {
                    products = docs;
                    document.getElementById('catalogEmptyMsg').classList.add('hidden');
                } else if (fallbackToSample) {
                    products = sampleAdminProducts;
                    document.getElementById('catalogEmptyMsg').classList.add('hidden');
                } else {
                    products = [];
                    document.getElementById('catalogEmptyMsg').classList.remove('hidden');
                }
                renderGrid();
            }, (err) => {
                console.error("Error escuchando productos:", err);
                if (fallbackToSample) {
                    products = sampleAdminProducts;
                    renderGrid();
                }
            });
        }

        async function loadUserOrBusinessBrand(user) {
            try {
                if (user) {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists() && userDoc.data().businessName) {
                        updateBranding(userDoc.data().businessName);
                        return;
                    }
                }
                const bizDoc = await getDoc(doc(db, "config", "negocio"));
                if (bizDoc.exists() && bizDoc.data().name) {
                    updateBranding(bizDoc.data().name);
                }
            } catch (e) {
                console.error("Error cargando empresa:", e);
            }
        }

        onAuthStateChanged(auth, async (user) => {
            const isTestMode = localStorage.getItem('testMode') === 'true';

            if (!user && !isTestMode) {
                if (unsubscribeProducts) {
                    unsubscribeProducts();
                    unsubscribeProducts = null;
                }
                showAuthScreen();
                lucide.createIcons();
                return;
            }

            showCatalogScreen();
            await loadUserOrBusinessBrand(user);

            if (user) {
                document.getElementById('headerSubStatus').innerText = user.email || "Catálogo";
                listenAdminProducts(user.uid, false);
            } else {
                document.getElementById('headerSubStatus').innerText = "Modo de Prueba";
                const bizDoc = await getDoc(doc(db, "config", "negocio"));
                const ownerId = bizDoc.exists() ? bizDoc.data().ownerId : null;
                listenAdminProducts(ownerId, true);
            }
            lucide.createIcons();
        });

        window.enableTestMode = async () => {
            localStorage.setItem('testMode', 'true');
            showCatalogScreen();
            updateBranding("PRODUCTOS LS (MODO PRUEBA)");
            document.getElementById('headerSubStatus').innerText = "Modo de Prueba";
            await loadUserOrBusinessBrand(null);
            const bizDoc = await getDoc(doc(db, "config", "negocio"));
            const ownerId = bizDoc.exists() ? bizDoc.data().ownerId : null;
            listenAdminProducts(ownerId, true);
            lucide.createIcons();
        };

        window.logout = async () => {
            localStorage.removeItem('testMode');
            if (unsubscribeProducts) {
                unsubscribeProducts();
                unsubscribeProducts = null;
            }
            try {
                await signOut(auth);
            } catch (e) {
                console.error("Error al cerrar sesión:", e);
            }
            window.location.href = "login.html";
        };

        function renderGrid() {
            const grid = document.getElementById('catalogGrid');
            grid.innerHTML = products.map(p => {
                const itemsFromThisProduct = cart.filter(item => item.pId === p.id).length;
                return `
                <div class="product-card" onclick="openModal('${p.id}')">
                    ${itemsFromThisProduct > 0 ? `<div class="badge-count">${itemsFromThisProduct}</div>` : ''}
                    <img src="${cleanUrl(p.img)}" alt="${p.name || ''}">
                    <h3 class="text-[9px] font-black uppercase italic tracking-tighter mb-1 truncate px-2">${p.name || '---'}</h3>
                    <p class="text-[11px] font-bold text-black">${getProductPriceText(p)}</p>
                </div>
            `;
            }).join('');
            lucide.createIcons();
        }

        window.openModal = (id) => {
            currentProduct = products.find(p => p.id === id);
            if (!currentProduct) return;
            document.getElementById('modalTitle').innerText = currentProduct.name || '---';

            const descEl = document.getElementById('modalDesc');
            if (currentProduct.description && currentProduct.description.trim()) {
                descEl.innerText = currentProduct.description.trim();
                descEl.classList.remove('hidden');
            } else {
                descEl.innerText = '';
                descEl.classList.add('hidden');
            }

            const modal = document.getElementById('productModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
            filterModalVariants('todos');
            document.body.style.overflow = 'hidden';
        };

        window.closeModal = () => {
            const modal = document.getElementById('productModal');
            modal.classList.remove('active');
            setTimeout(() => {
                modal.style.display = 'none';
                document.body.style.overflow = 'auto';
                renderGrid();
            }, 400);
        };

        window.filterModalVariants = (cat) => {
            currentModalFilter = cat;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`m-btn-${cat}`).classList.add('active');
            renderVariants();
        };

        window.toggleVariant = (vId) => {
            const variants = Array.isArray(currentProduct.variants) ? currentProduct.variants : [];
            const variant = variants.find(v => (v.id || (v.title + v.size)) === vId);
            if (!variant) return;

            const existingIndex = cart.findIndex(item => item.pId === currentProduct.id && item.vId === vId);

            if (existingIndex > -1) {
                cart.splice(existingIndex, 1);
            } else {
                cart.push({
                    pId: currentProduct.id,
                    vId: vId,
                    pName: currentProduct.name,
                    vName: variant.title,
                    size: variant.size,
                    price: parseFloat(variant.priceNew) || 0,
                    wa: (currentProduct.whatsapp || "584120000000").replace(/\D/g, '')
                });
            }
            renderVariants();
            updateCartUI();
        };

        function renderVariants() {
            const container = document.getElementById('variantsContainer');
            let variants = Array.isArray(currentProduct.variants) ? currentProduct.variants : [];

            if (currentModalFilter !== 'todos') {
                variants = variants.filter(v => (v.gender || '').toLowerCase() === currentModalFilter);
            }

            container.innerHTML = variants.map(v => {
                const vId = v.id || (v.title + v.size);
                const isSelected = cart.some(item => item.pId === currentProduct.id && item.vId === vId);
                const priceNewNum = parseFloat(v.priceNew) || 0;
                const priceOldNum = parseFloat(v.priceOld);
                const hasOldPrice = !Number.isNaN(priceOldNum) && priceOldNum > priceNewNum;

                return `
                <div class="variant-card ${isSelected ? 'selected' : ''}" onclick="toggleVariant('${vId}')">
                    <img src="${cleanUrl(v.img || currentProduct.img)}" class="w-12 h-12 object-contain rounded-lg" alt="${v.title || ''}">
                    <div class="flex-1">
                        <h4 class="font-black italic uppercase text-[10px] leading-tight">${v.title || ''}</h4>
                        <div class="flex gap-2 items-center mt-0.5">
                            <span class="text-[8px] font-bold text-gray-400 uppercase tracking-widest">${v.size || ''}</span>
                            <span class="text-[8px] font-extrabold px-1.5 py-0.5 bg-gray-100 rounded text-gray-600 uppercase">${v.gender || 'Unisex'}</span>
                        </div>
                        <div class="flex items-center gap-2 mt-1">
                            ${hasOldPrice ? `<span class="text-xs font-bold line-through text-red-400">$${priceOldNum.toFixed(2)}</span>` : ''}
                            <p class="text-sm font-black">$${priceNewNum.toFixed(2)}</p>
                        </div>
                    </div>
                    <div class="selector-dot"></div>
                </div>
            `;
            }).join('');
        }

        function updateCartUI() {
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            const count = cart.length;
            const bar = document.getElementById('cartBar');
            const badge = document.getElementById('cartCountBadge');

            if (count > 0) {
                bar.style.display = 'flex';
                badge.innerText = count;
                badge.classList.remove('hidden');
                document.getElementById('cartBarCount').innerText = `${count} ${count === 1 ? 'producto' : 'productos'} seleccionado(s)`;
                document.getElementById('cartBarTotal').innerText = `$${total.toFixed(2)}`;
            } else {
                bar.style.display = 'none';
                badge.classList.add('hidden');
            }
            lucide.createIcons();
        }

        window.sendOrder = () => {
            if (cart.length === 0) return;

            const brandName = document.getElementById('headerBrandName').innerText || 'PRODUCTOS LS';
            const targetPhone = cart[0].wa || "584120000000";

            let message = `¡Hola! 👋 Quisiera comprar estos perfumes en *${brandName}*:\n\n`;

            cart.forEach((item) => {
                message += `🔹 *${item.pName}*\n`;
                message += `   Variante: ${item.vName} (${item.size})\n`;
                message += `   Precio: $${item.price.toFixed(2)}\n\n`;
            });

            const total = cart.reduce((sum, item) => sum + item.price, 0);
            message += `━━━━━━━━━━━━━━\n`;
            message += `✅ *TOTAL DEL PEDIDO: $${total.toFixed(2)}*\n\n`;
            message += `¿Están disponibles?`;

            window.open(`https://wa.me/${targetPhone}?text=${encodeURIComponent(message)}`, '_blank');
        };

        lucide.createIcons();
    </script>
</body>
</html>
